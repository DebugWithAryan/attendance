server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed assets never change; the shell must not be cached.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ { proxy_pass http://server:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /files/ { proxy_pass http://server:4000; }

  # Client-side routing: every unknown path returns the shell.
  location / { try_files $uri /index.html; }
}

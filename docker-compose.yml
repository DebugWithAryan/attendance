# Local or single-box deployment. On AWS, drop the db service and point
# DATABASE_URL at RDS; the server image is the only thing ECS needs.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    # 256 MB is comfortable for a few hundred students.
    deploy: { resources: { limits: { memory: 512M } } }

  server:
    build: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/attendance
      JWT_SECRET: ${JWT_SECRET:-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/var/uploads
      PG_POOL_MAX: 8
    depends_on:
      db: { condition: service_healthy }
    volumes: [uploads:/app/var/uploads]
    # Run migrations, then serve. Safe to repeat: applied files are skipped.
    command: sh -c "node src/infra/db/migrate.js && node src/main.js"
    deploy: { resources: { limits: { memory: 384M } } }

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [server]
    deploy: { resources: { limits: { memory: 64M } } }

volumes:
  dbdata:
  uploads:
